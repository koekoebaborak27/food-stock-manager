# ローカル開発用のPostgres。本番はSupabaseを使うため、ここには含めない。
# 起動: docker compose -f docker/docker-compose.yml up -d db
#
# name を明示しないと、Composeはディレクトリ名（docker）をプロジェクト名にする。
# 同じ「docker」というフォルダ名で docker-compose.yml を置く別プロジェクトが
# このマシンに存在すると、コンテナ名・ボリューム名が衝突し、他プロジェクトの
# DBボリュームを誤って使い回してしまう（実際に発生したため、必ず明示すること）。
name: food-stock-manager
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
