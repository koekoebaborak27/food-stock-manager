name: CI

# paths-ignore: ドキュメントだけの変更では CI を起動しない。
# 変更ファイルが「すべて」パターンに一致する場合にのみスキップされるため、
# 1 ファイルでもコードが混ざれば通常どおり全ステップが実行される。
# （このファイル自体は対象外なので、ci.yml の変更は必ず CI で検証される）
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:password@localhost:5432/app_db
      # schema.prismaのdirectUrlが参照するため必須。ローカル同様プーラーを挟まないので同じ値でよい。
      DIRECT_URL: postgresql://app:password@localhost:5432/app_db

    steps:
      - uses: actions/checkout@v7

      # pnpm は setup-node より先に入れる（setup-node の cache: pnpm が
      # pnpm store path を実行するため、pnpm が PATH にある必要がある）。
      # バージョンは package.json の packageManager フィールドから解決される。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # 型を参照する Typecheck / Test より前に Client を生成する。
      # （pnpm ストアがキャッシュヒットすると @prisma/client の postinstall が走らず、
      #   生成前に tsc すると型解決に失敗する）
      - name: Prisma validate
        run: pnpm exec prisma validate
      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      # 0 からスキーマを再現できることをここで検証する。
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Test
        run: pnpm test

      # フレームワークを導入して package.json に build を追加したら、次を有効にする。
      # - name: Build
      #   run: pnpm build

  # mainへのpush（verify成功後）でのみ、Cloud Runへ自動デプロイする。
  # pull_requestでは動かさない（本番のCloud Runサービスを差し替える操作のため）。
  # 手順の正本はdocs/specs/99_infra/infra_design_07_CI_CDの自動化.md。
  deploy-api:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity連携でOIDCトークンを発行するために必須
    outputs:
      api_url: ${{ steps.api-url.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push api image
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/food-stock-manager/api:${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      # apiには環境変数依存のビルド時引数がないため、mainのイメージが本番用そのまま。
      - name: Deploy api to Cloud Run
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/food-stock-manager/api:${{ github.sha }}
        run: |
          gcloud run deploy api \
            --image="$IMAGE" \
            --region=asia-northeast1 \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --set-secrets=DATABASE_URL=database-url:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,GOOGLE_CALLBACK_URL=google-callback-url:latest,WEB_BASE_URL=web-base-url:latest,VAPID_PUBLIC_KEY=vapid-public-key:latest,VAPID_PRIVATE_KEY=vapid-private-key:latest,VAPID_SUBJECT=vapid-subject:latest,INTERNAL_NOTIFICATION_SECRET=internal-notification-secret:latest

      - id: api-url
        run: echo "url=$(gcloud run services describe api --region=asia-northeast1 --format='value(status.url)')" >> "$GITHUB_OUTPUT"

  # webはapiのURLをビルド時に焼き込む制約があるため、deploy-apiの完了を待つ
  # （docs/specs/99_infra/infra_design_02_Artifact_Registry.md参照）。
  deploy-web:
    needs: deploy-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push web image
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/food-stock-manager/web:${{ github.sha }}
          API_BASE_URL: ${{ needs.deploy-api.outputs.api_url }}
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg API_BASE_URL="$API_BASE_URL" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy web to Cloud Run
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/food-stock-manager/web:${{ github.sha }}
        run: |
          gcloud run deploy web \
            --image="$IMAGE" \
            --region=asia-northeast1 \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2
